name: compatibility

on:
  schedule:
    - cron: "21 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Forward-compatibility signal: build, test, lint, and kernel-replay the
# package on the current Lean stable release and the current release candidate
# (elan channels, so this job never goes stale). Golden snapshots store live
# toolchain version bytes as a <LEAN_VERSION> token and comparisons normalize
# only those bytes, so the full behavioral suite runs on every channel; any
# non-version output drift on a new toolchain fails this job by design.
jobs:
  lean-channel:
    name: lean-${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Select Lean ${{ matrix.channel }} toolchain
        run: printf 'leanprover/lean4:%s\n' "${{ matrix.channel }}" > lean-toolchain
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: false
          test: false
          lint: false
      - name: Build package
        run: lake build
      - name: Run tests
        run: lake test
      - name: Run lint
        run: lake lint
      - name: Run leanchecker
        run: lake env leanchecker --fresh LeanAssumptions
