name: compatibility

on:
  schedule:
    - cron: "21 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lean-release-candidate:
    name: lean-release-candidate
    runs-on: ubuntu-latest
    env:
      LEAN_RC_TOOLCHAIN: leanprover/lean4:v4.30.0-rc2
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Select Lean release-candidate toolchain
        run: printf '%s\n' "$LEAN_RC_TOOLCHAIN" > lean-toolchain
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: false
          test: false
          lint: false
      - name: Build package
        run: lake build
      - name: Run tests
        run: lake test
      - name: Run lint
        run: lake lint
      - name: Run leanchecker
        run: lake env leanchecker --fresh LeanAssumptions
