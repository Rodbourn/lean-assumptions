name: ci

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: build-test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build package
        run: lake build
      - name: Run tests
        run: lake test
      - name: Run lint
        run: lake lint
      - name: Run leanchecker
        run: lake env leanchecker --fresh LeanAssumptions
      - name: Validate coverage ledger
        run: python scripts/check_coverage_ledger.py
      - name: Validate report JSON schema
        run: python scripts/check_report_schema.py
      - name: Validate policy JSON schema
        run: python scripts/check_policy_schema.py
      - name: Validate line endings
        run: python scripts/check_line_endings.py
      - name: Validate runnable examples
        run: python scripts/check_examples.py
      - name: Validate CI workflow
        run: python scripts/check_ci_workflow.py
      - name: Smoke-test CLI executable
        run: lake env lean-assumptions --module LeanAssumptionsTest.Fixtures --decl LeanAssumptionsTest.Fixtures.packageBinder --format json --allow-package LeanAssumptionsTest.Fixtures.ProofPackage

  performance-baseline:
    name: performance-baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build CLI and smoke fixtures
        run: lake build lean-assumptions LeanAssumptionsTest.Fixtures
      - name: Validate performance baseline
        run: python scripts/check_performance_baseline.py

  release-readiness:
    name: release-readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build CLI and smoke fixtures
        run: lake build lean-assumptions LeanAssumptionsTest.Fixtures
      - name: Validate local release readiness
        run: python scripts/check_release_readiness.py

  api-docs:
    name: api-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build API docs
        working-directory: docbuild
        env:
          DOCGEN_SRC: file
        run: lake build LeanAssumptions:docs
